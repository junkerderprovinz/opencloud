name: Build & Push

# Builds the OpenCloud Unraid wrapper image for both channels and pushes to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/opencloud)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/opencloud),
#     once the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret are
#     both set; until then the build stays GHCR-only.
#
# Two channels, selected by the upstream base image (--build-arg BASE=...):
#   :production  ->  opencloudeu/opencloud          (from `ARG BASE=` in Dockerfile)
#   :rolling     ->  opencloudeu/opencloud-rolling  (from `ARG BASE_ROLLING=`)
# CI reads both from the Dockerfile. They follow upstream's floating :latest
# tags, which Renovate leaves alone; the weekly rebuild keeps them current.
#
# Architecture: one native build job per channel and platform, amd64 on
# ubuntu-latest and arm64 on ubuntu-24.04-arm (free for public repos). Each job
# boots its image as a smoke gate (gosu and opencloud present, the entrypoint
# reaching "OPENCLOUD IS READY" and the server staying up), boots it again with
# the branding app on, pushes by digest, and a per-channel merge job assembles
# the multi-arch manifest under that channel's tags for both registries.
#
# Triggers:
#   * Push to main           -> production: production, latest, sha-<short>
#                               rolling:    rolling, sha-<short>-rolling
#   * Tag v*.*.*             -> production: <version>, <major>.<minor>, <major>, production, sha-<short>
#                               rolling:    <version>-rolling, rolling, sha-<short>-rolling
#   * Push to another branch -> <branch>, <branch>-rolling on GHCR only, for testing;
#                               renovate/* branches do not build, a branch named
#                               latest, production or rolling gets no tag, and a
#                               newer push cancels the build still running
#   * Weekly cron (Sun 04 UTC), which picks up upstream OpenCloud and Alpine updates
#   * Manual workflow_dispatch

on:
  push:
    branches: [ '**', '!renovate/**' ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Two quick pushes to a branch race for its <branch> tag, so the older run is
# cancelled. Runs on main and release tags each get a group of their own, so
# every commit there publishes its sha tags.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref_type == 'branch' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: opencloud

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # Two base axes -> a real cross product: {production,rolling} x {amd64,arm64}
        # = 4 jobs. The `include` entries fill in platform/runner per arch (they key
        # on the existing `arch` value, so they are merged, not appended).
        channel: [ production, rolling ]
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth: read the channel's base pin from the Dockerfile.
      - name: Resolve base image for channel
        id: base
        run: |
          set -euo pipefail
          if [ "${{ matrix.channel }}" = "rolling" ]; then
            base=$(grep -oE 'ARG BASE_ROLLING=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          else
            base=$(grep -oE 'ARG BASE=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          fi
          [ -n "$base" ] || { echo "could not resolve base for ${{ matrix.channel }}"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ matrix.channel }} base: $base"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      # Build natively for this arch/channel and load it locally for the smoke gate.
      - name: Build ${{ matrix.channel }} ${{ matrix.arch }} image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ steps.base.outputs.base }}
          push: false
          load: true
          tags: opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.channel }}-${{ matrix.arch }}

      # Smoke gate. A full WebUI check needs volumes and a real domain, so this
      # gate checks that gosu, opencloud and the entrypoint are present, and that
      # the entrypoint runs init, drops to PUID:PGID, prints the READY banner and
      # the server stays up for a few seconds. That still catches a broken
      # privilege drop, which a file check would miss.
      - name: Smoke test (${{ matrix.channel }}/${{ matrix.arch }})
        run: |
          set -euo pipefail
          img=opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}

          echo "== presence gate =="
          docker run --rm --entrypoint /bin/sh "$img" -c '
            set -e
            command -v gosu >/dev/null || { echo "gosu missing"; exit 1; }
            command -v opencloud >/dev/null || { echo "opencloud missing"; exit 1; }
            test -x /usr/local/bin/entrypoint.sh || { echo "entrypoint.sh not executable"; exit 1; }
            test -x /usr/local/bin/print-banner.sh || { echo "print-banner.sh not executable"; exit 1; }
            gosu --version
            opencloud version || true
          '

          echo "== boot gate =="
          name=oc-smoke-${{ matrix.channel }}-${{ matrix.arch }}
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e IDM_ADMIN_PASSWORD=smoketest \
            -e OC_URL=https://localhost:9200 \
            -e OC_INSECURE=true \
            "$img"

          ok=0
          deadline=$((SECONDS + 150))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker logs "$name" 2>&1 | grep -q 'OPENCLOUD IS READY'; then
              echo "READY banner seen after ${SECONDS}s, checking that the server stays up"
              sleep 8
              if [ -n "$(docker ps -q --filter name="$name")" ]; then ok=1; else echo "server exited right after the banner"; fi
              break
            fi
            if [ -z "$(docker ps -q --filter name="$name")" ]; then
              echo "container exited early:"; break
            fi
            sleep 3
          done

          echo "== last logs =="
          docker logs "$name" 2>&1 | tail -40 || true
          docker rm -f "$name" >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "smoke failed"; exit 1; }
          echo "smoke passed"

      # The branding app runs only with BRANDING_APP=true, so it gets boots of its
      # own; the last one switches it off again on the same volumes.
      - name: Branding smoke (${{ matrix.channel }}/${{ matrix.arch }})
        env:
          ADMIN_PASSWORD: smoketest
        run: |
          set -euo pipefail
          img=opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}
          name=oc-branding-${{ matrix.channel }}-${{ matrix.arch }}
          base=https://127.0.0.1:9200
          cd "$(mktemp -d)"
          start() {
            docker rm -f -v "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" -p 127.0.0.1:9200:9200 \
              -v "$name-config:/etc/opencloud" \
              -v "$name-data:/var/lib/opencloud" \
              -e IDM_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              -e OC_URL=https://localhost:9200 \
              -e OC_INSECURE=true \
              -e PROXY_ENABLE_BASIC_AUTH=true \
              -e BRANDING_APP="$1" \
              "$img" >/dev/null
          }
          # The banner art would fill most of the tail after a restart.
          cleanup() {
            echo "== wrapper and brandingd lines =="
            docker logs "$name" 2>&1 | grep -E '\[entrypoint\]|brandingd|theme: ' || true
            echo "== last logs =="
            docker logs "$name" 2>&1 | grep -vF -e '░' -e '▒' -e '▓' -e '█' | tail -60 || true
            docker rm -f -v "$name" >/dev/null 2>&1 || true
            docker volume rm "$name-config" "$name-data" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          fetch() { curl -sSkf --max-time 20 "$@" || { echo "request failed: $*" >&2; return 1; }; }
          expect() {
            local want=$1 got
            shift
            got=$(curl -sk --max-time 20 -o /dev/null -w '%{http_code}' "$@") || true
            [ "$got" = "$want" ] || { echo "expected $want, got $got for $*"; return 1; }
          }
          # With the app off, /brandingsvc/ falls through to the web UI.
          up() {
            curl -skf --max-time 20 -o /dev/null "$base/status.php" || return 1
            [ "$1" = false ] || [ "$(curl -skf --max-time 20 "$base/brandingsvc/health")" = ok ]
          }
          wait_up() {
            local deadline=$((SECONDS + 180))
            until up "$1"; do
              [ "$SECONDS" -lt "$deadline" ] || { echo "OpenCloud or brandingd did not come up within 180s"; return 1; }
              sleep 3
            done
          }
          admin=(-u "admin:$ADMIN_PASSWORD" -H 'X-Branding-Request: 1')
          start true
          wait_up true

          echo "== base theme matches the server =="
          docker run --rm --entrypoint cat "$img" /usr/local/share/opencloud-branding/base-theme.json | jq -S '.clients.web.themes' > baked.json
          fetch "$base/themes/opencloud/theme.json" | jq -S '.clients.web.themes' > served.json
          diff baked.json served.json

          echo "== app is registered =="
          fetch "$base/config.json" | jq -e '.external_apps[] | select(.id == "branding")' >/dev/null

          echo "== refusals =="
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=' | base64 -d > logo.png
          expect 401 -H 'X-Branding-Request: 1' -X PUT --data-binary @logo.png "$base/brandingsvc/api/image/logo"
          expect 403 -u "admin:$ADMIN_PASSWORD" -X PUT --data-binary @logo.png "$base/brandingsvc/api/image/logo"
          expect 405 -X OPTIONS "$base/brandingsvc/api/image/logo"
          expect 405 "${admin[@]}" -X OPTIONS --data-binary @logo.png "$base/brandingsvc/api/image/logo"
          fetch "${admin[@]}" "$base/brandingsvc/api/state" | jq -e '.logo == ""'

          echo "== admin upload =="
          expect 200 "${admin[@]}" -X PUT --data-binary @logo.png "$base/brandingsvc/api/image/logo"
          fetch "$base/themes/opencloud/theme.json" > theme.json
          jq -e '.common.logo | startswith("themes/_branding/logo-")' theme.json
          jq -e '.common.logo as $l | .clients.web.defaults.logo == $l and any(.clients.web.themes[]; .isDark) and all(.clients.web.themes[]; (.logo // $l) == $l)' theme.json
          logo=$(jq -r '.common.logo' theme.json)
          fetch "$base/$logo" -o served-logo.png
          cmp logo.png served-logo.png

          echo "== svg is sanitised =="
          printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" onload="alert(1)"><script>alert(2)</script><rect width="1" height="1"/></svg>' > evil.svg
          expect 200 "${admin[@]}" -X PUT --data-binary @evil.svg "$base/brandingsvc/api/image/logo-dark"
          dark=$(fetch "$base/themes/opencloud/theme.json" | jq -r '[.clients.web.themes[] | select(.isDark)][0].logo')
          case "$dark" in themes/_branding/logo-dark-*.svg) ;; *) echo "dark logo is $dark"; exit 1 ;; esac
          fetch "$base/$dark" -o stored.svg
          if grep -qiE 'script|onload|alert' stored.svg; then echo "SVG was not sanitised"; cat stored.svg; exit 1; fi
          grep -q '<rect' stored.svg

          echo "== login background after restart =="
          expect 200 "${admin[@]}" -X PUT --data-binary @logo.png "$base/brandingsvc/api/image/background"
          bg=$(fetch "${admin[@]}" "$base/brandingsvc/api/state" | jq -r '.background')
          case "$bg" in /themes/_branding/background-*.png) ;; *) echo "background is $bg"; exit 1 ;; esac
          docker restart "$name" >/dev/null
          wait_up true
          fetch "$base/signin/v1/identifier" > identifier.html
          grep -q 'data-bg-img="/brandingsvc/login-background"' identifier.html
          fetch "$base/brandingsvc/login-background" -o background.png
          cmp logo.png background.png

          echo "== app off, branding kept =="
          start false
          wait_up false
          fetch "$base/config.json" | jq -e '[.external_apps[]? | select(.id == "branding")] | length == 0'
          [ "$(curl -sk --max-time 20 "$base/brandingsvc/health")" != ok ] || { echo "brandingsvc still answers"; exit 1; }
          fetch "$base/signin/v1/identifier" > identifier.html
          grep -qF "data-bg-img=\"$bg\"" identifier.html || { echo "login page does not use $bg"; grep -o 'data-bg-img="[^"]*"' identifier.html; exit 1; }
          fetch "$base$bg" -o background.png
          cmp logo.png background.png
          fetch "$base/themes/opencloud/theme.json" | jq -e --arg logo "$logo" '.common.logo == $logo'
          echo "branding smoke passed"

      # CVE scan of the locally loaded smoke image. Report-only (exit-code 0), so a
      # finding never blocks the build; results land in the repo's Security tab.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}
          format: sarif
          output: trivy-${{ matrix.channel }}-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-${{ matrix.channel }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.channel }}-${{ matrix.arch }}

      # Push this arch by digest without tags; the per-channel merge job assembles
      # the multi-arch manifest under the final tags.
      - name: Push ${{ matrix.channel }} ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ steps.base.outputs.base }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.channel }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.channel }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.channel }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        channel: [ production, rolling ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests for ${{ matrix.channel }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.channel }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror for main and release tags, active only once
      # DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret) are set
      # together; skipped otherwise, so CI stays green and GHCR-only until then.
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Channel-conditional tags. `production` is the stable default (also carries
      # `latest` on the default branch); `rolling` carries `rolling` + a
      # `-rolling`-suffixed version/sha so the two channels never collide. Other
      # branches get <branch> and <branch>-rolling on GHCR, except a branch named
      # like one of the reserved tags.
      - name: Extract metadata (${{ matrix.channel }} tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
          tags: |
            type=raw,value=production,enable=${{ matrix.channel == 'production' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
            type=raw,value=latest,enable=${{ matrix.channel == 'production' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ matrix.channel == 'production' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.channel == 'production' }}
            type=semver,pattern={{major}},enable=${{ matrix.channel == 'production' }}
            type=sha,format=short,enable=${{ matrix.channel == 'production' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
            type=raw,value=rolling,enable=${{ matrix.channel == 'rolling' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
            type=semver,pattern={{version}},suffix=-rolling,enable=${{ matrix.channel == 'rolling' }}
            type=sha,format=short,suffix=-rolling,enable=${{ matrix.channel == 'rolling' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
            type=ref,event=branch,enable=${{ matrix.channel == 'production' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && !contains(fromJSON('["latest","production","rolling"]'), github.ref_name) }}
            type=ref,event=branch,suffix=-rolling,enable=${{ matrix.channel == 'rolling' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && !contains(fromJSON('["latest","production","rolling"]'), github.ref_name) }}

      # Assemble the multi-arch manifest for every tag (both registries) from the
      # per-arch digests pushed to GHCR. imagetools copies platform images across
      # registries where needed (the Docker Hub tags).
      - name: Create multi-arch manifests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          sources=""
          for d in *; do sources="$sources ${src}@sha256:${d}"; done
          echo "sources:${sources}"
          tagargs=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tagargs="$tagargs -t $tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "tags:${tagargs}"
          # Cross-registry copy (GHCR -> Docker Hub) can hit a transient HTTP/2
          # PROTOCOL_ERROR; retry a few times before failing.
          n=0
          until docker buildx imagetools create ${tagargs} ${sources}; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then echo "imagetools create failed after $n attempts"; exit 1; fi
            echo "imagetools create failed (attempt $n); retrying in $((n * 15))s..."
            sleep $((n * 15))
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Mirror the GitHub README to the Docker Hub repo description once both channel
  # manifests exist. It signs in with DOCKERHUB_TOKEN, which needs read, write
  # and delete scope to edit the description, and is skipped until that secret
  # is set.
  dockerhub-description:
    needs: merge
    if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    # The sync is cosmetic, so a credential problem here (a 401, say) must not
    # fail the image build.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (README for Docker Hub sync)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker Hub description sync ready?
        id: dhdesc
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping the Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "One-click OpenCloud for Unraid: auto-init, permission heal, PUID/PGID, production and rolling tags."
          enable-url-completion: true

name: Build & Push

# -----------------------------------------------------------------------------
# Builds the OpenCloud Unraid wrapper image for BOTH channels and pushes to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/opencloud)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/opencloud)
#     - active only once the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
#       secret are set together; until then the build stays GHCR-only.
#
# Two channels, selected by the upstream base image (--build-arg BASE=...):
#   :production  ->  opencloudeu/opencloud          (from `ARG BASE=` in Dockerfile)
#   :rolling     ->  opencloudeu/opencloud-rolling  (from `ARG BASE_ROLLING=`)
# Both pins live in the Dockerfile (Renovate tracks them); CI reads them from
# there so there is a single source of truth.
#
# Architecture: one NATIVE build job per (channel, platform) - amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm (free for public repos). Each job
# boots its image as a smoke gate (presence of gosu/opencloud + the entrypoint
# reaching "OPENCLOUD IS READY" and the server staying up), pushes by digest,
# and a per-channel merge job assembles the multi-arch manifest under that
# channel's tags for both registries.
#
# Triggers:
#   * Push to main           -> production: production, latest, sha-<short>
#                               rolling:    rolling, sha-<short>-rolling
#   * Tag v*.*.*             -> production: <version>, <major>.<minor>, <major>
#                               rolling:    <version>-rolling
#   * Weekly cron (Sun 04 UTC) - picks up upstream OpenCloud + Alpine updates
#   * Manual workflow_dispatch
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: opencloud

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # Two base axes -> a real cross product: {production,rolling} x {amd64,arm64}
        # = 4 jobs. The `include` entries fill in platform/runner per arch (they key
        # on the existing `arch` value, so they are merged, not appended).
        channel: [ production, rolling ]
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth: read the channel's base pin from the Dockerfile.
      - name: Resolve base image for channel
        id: base
        run: |
          set -euo pipefail
          if [ "${{ matrix.channel }}" = "rolling" ]; then
            base=$(grep -oE 'ARG BASE_ROLLING=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          else
            base=$(grep -oE 'ARG BASE=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          fi
          [ -n "$base" ] || { echo "could not resolve base for ${{ matrix.channel }}"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ matrix.channel }} base: $base"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      # Build natively for this arch/channel and load it locally for the smoke gate.
      - name: Build ${{ matrix.channel }} ${{ matrix.arch }} image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ steps.base.outputs.base }}
          push: false
          load: true
          tags: opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.channel }}-${{ matrix.arch }}

      # Smoke gate. A full OpenCloud WebUI boot needs volumes + a real domain, so
      # the gate stays minimal but MEANINGFUL: (1) gosu/opencloud/entrypoint are
      # present; (2) the entrypoint runs init, drops to PUID:PGID via gosu, prints
      # the READY banner, and the server stays up for a few seconds afterwards.
      # This catches a broken privilege drop (e.g. gosu/uid issue) that a static
      # file check would miss.
      - name: Smoke test - ${{ matrix.channel }}/${{ matrix.arch }} must init, drop privileges and stay up
        run: |
          set -euo pipefail
          img=opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}

          echo "== presence gate =="
          docker run --rm --entrypoint /bin/sh "$img" -c '
            set -e
            command -v gosu >/dev/null || { echo "gosu missing"; exit 1; }
            command -v opencloud >/dev/null || { echo "opencloud missing"; exit 1; }
            test -x /usr/local/bin/entrypoint.sh || { echo "entrypoint.sh not executable"; exit 1; }
            test -x /usr/local/bin/print-banner.sh || { echo "print-banner.sh not executable"; exit 1; }
            gosu --version
            opencloud version || true
          '

          echo "== boot gate =="
          name=oc-smoke-${{ matrix.channel }}-${{ matrix.arch }}
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e IDM_ADMIN_PASSWORD=smoketest \
            -e OC_URL=https://localhost:9200 \
            -e OC_INSECURE=true \
            "$img"

          ok=0
          deadline=$((SECONDS + 150))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker logs "$name" 2>&1 | grep -q 'OPENCLOUD IS READY'; then
              echo "READY banner seen after ${SECONDS}s - verifying the server stays up..."
              sleep 8
              if [ -n "$(docker ps -q --filter name="$name")" ]; then ok=1; else echo "server exited right after the banner"; fi
              break
            fi
            if [ -z "$(docker ps -q --filter name="$name")" ]; then
              echo "container exited early:"; break
            fi
            sleep 3
          done

          echo "== last logs =="
          docker logs "$name" 2>&1 | tail -40 || true
          docker rm -f "$name" >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "smoke failed"; exit 1; }
          echo "smoke passed"

      # CVE scan of the locally-loaded smoke image. Report-only (exit-code 0) so a
      # finding never blocks the build - results land in the repo Security tab.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opencloud:smoke-${{ matrix.channel }}-${{ matrix.arch }}
          format: sarif
          output: trivy-${{ matrix.channel }}-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.channel }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.channel }}-${{ matrix.arch }}

      # Push this arch by digest (no tags yet - the per-channel merge job assembles
      # the multi-arch manifest under the final tags).
      - name: Push ${{ matrix.channel }} ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ steps.base.outputs.base }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.channel }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.channel }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.channel }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        channel: [ production, rolling ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests for ${{ matrix.channel }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.channel }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror - active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; skipped otherwise so CI stays
      # green and GHCR-only until then.
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Channel-conditional tags. `production` is the stable default (also carries
      # `latest` on the default branch); `rolling` carries `rolling` + a
      # `-rolling`-suffixed version/sha so the two channels never collide.
      - name: Extract metadata (${{ matrix.channel }} tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=production,enable=${{ matrix.channel == 'production' }}
            type=raw,value=latest,enable=${{ matrix.channel == 'production' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ matrix.channel == 'production' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.channel == 'production' }}
            type=semver,pattern={{major}},enable=${{ matrix.channel == 'production' }}
            type=sha,format=short,enable=${{ matrix.channel == 'production' }}
            type=raw,value=rolling,enable=${{ matrix.channel == 'rolling' }}
            type=semver,pattern={{version}},suffix=-rolling,enable=${{ matrix.channel == 'rolling' }}
            type=sha,format=short,suffix=-rolling,enable=${{ matrix.channel == 'rolling' }}

      # Assemble the multi-arch manifest for EVERY tag (both registries) from the
      # per-arch digests pushed to GHCR. imagetools copies platform images across
      # registries where needed (the Docker Hub tags).
      - name: Create multi-arch manifests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          sources=""
          for d in *; do sources="$sources ${src}@sha256:${d}"; done
          echo "sources:${sources}"
          tagargs=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tagargs="$tagargs -t $tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "tags:${tagargs}"
          # Cross-registry copy (GHCR -> Docker Hub) can hit a transient HTTP/2
          # PROTOCOL_ERROR; retry a few times before failing.
          n=0
          until docker buildx imagetools create ${tagargs} ${sources}; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then echo "imagetools create failed after $n attempts"; exit 1; fi
            echo "imagetools create failed (attempt $n); retrying in $((n * 15))s..."
            sleep $((n * 15))
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Mirror the GitHub README to the Docker Hub repo description (once, after both
  # channel manifests exist). Needs the DOCKERHUB_PASSWORD secret (a PAT scoped to
  # edit repos, or the account password) - the push token lacks that scope and
  # returns 403. Skipped until the secret is set, so a missing credential never
  # fails the build.
  dockerhub-description:
    needs: merge
    if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
    # Cosmetic README->Docker Hub sync; a credential hiccup here (e.g. 401) must
    # never fail the image build/publish, which is the real deliverable.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (README for Docker Hub sync)
        uses: actions/checkout@v7

      - name: Docker Hub description sync ready?
        id: dhdesc
        env:
          PW: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_PASSWORD not set - skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "One-click OpenCloud for Unraid - auto-init, permission heal, PUID/PGID (production + rolling channels)."
          enable-url-completion: true
